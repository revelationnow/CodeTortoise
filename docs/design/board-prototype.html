<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Review Board prototype (design reference)</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f7fb; --ink: #151a2d; --muted: #6a7089; --line: #e2e5ef; --card: #ffffff;
    --flow: #6d4aff; --flow-glow: rgba(109, 74, 255, .28);
    --chg: #ffb020; --chg-deep: #c26a00; --fx: #ff4d6d; --fx-bg: #ffe4ea; --field: #00a6a6; --field-bg: #dcf7f5;
    --add: #e6f9ee; --add-ink: #1a9a4f; --del: #ffecef; --del-ink: #d63a5a;
    --warn: #ff4d6d; --warn-bg: #fff0f3; --info: #3b82f6; --info-bg: #eef5ff; --ok: #16a34a; --ok-bg: #ecfbf1;
    --mono: "JetBrains Mono", ui-monospace, monospace; --sans: Inter, system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.45 var(--sans); overflow: hidden; }
  body { display: grid; grid-template-rows: auto auto 1fr; }
  header { display: flex; align-items: center; gap: 10px; padding: 10px 18px; background: linear-gradient(90deg, #151a2d, #2a2466); color: #fff; flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0; font-weight: 700; }
  .pill { font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 99px; letter-spacing: .03em; }
  .pill.high { background: var(--fx); color: #fff; } .pill.ghost { background: rgba(255,255,255,.14); color: #dfe0ff; }
  .about-btn { margin-left: auto; border: 0; cursor: pointer; font: 700 12.5px var(--sans); color: #151a2d; padding: 7px 14px; border-radius: 99px;
               background: linear-gradient(90deg, #ffd36b, #ffab1f); box-shadow: 0 4px 14px rgba(255,176,32,.35); }
  .about-btn:hover { filter: brightness(1.05); }
  .flows { display: flex; gap: 8px; padding: 10px 18px; overflow-x: auto; background: #fff; border-bottom: 1px solid var(--line); scrollbar-width: none; }
  .chip { flex: none; display: flex; align-items: center; gap: 8px; padding: 7px 12px 7px 7px; border-radius: 99px; background: #f1f2f8;
          border: 1.5px solid transparent; cursor: pointer; font-size: 12.5px; transition: .15s; user-select: none; }
  .chip:hover { background: #e9e8ff; } .chip.on { background: #efeaff; border-color: var(--flow); box-shadow: 0 0 0 4px var(--flow-glow); }
  .chip .num { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 11px; background: var(--flow); color: #fff; }
  .chip .path { font-family: var(--mono); font-size: 11.5px; }
  .tag { font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 6px; text-transform: uppercase; letter-spacing: .04em; }
  .tag.state { background: var(--field-bg); color: #007a7a; } .tag.contract { background: var(--fx-bg); color: #c81d44; }
  main { position: relative; display: flex; min-height: 0; }
  #stage { position: relative; flex: 1; overflow: hidden; touch-action: none; cursor: grab; }
  #stage.drag { cursor: grabbing; }
  #world { position: absolute; inset: 0; }
  body.dragging, body.dragging * { user-select: none !important; -webkit-user-select: none !important; }
  .resizer { position: absolute; left: -5px; top: 0; bottom: 0; width: 10px; cursor: col-resize; z-index: 6; }
  .resizer::after { content: ""; position: absolute; left: 4px; top: 50%; width: 2px; height: 36px; margin-top: -18px; border-radius: 2px; background: #c9cde0; }
  .resizer:hover::after, body.resizing .resizer::after { background: var(--flow); }
  body.resizing, body.resizing * { cursor: col-resize !important; user-select: none !important; }
  #panel, #about { position: relative; }
  .node.moved::after { content: "↔"; position: absolute; left: -10px; bottom: -10px; font-size: 10px; color: var(--muted); }
  body.nodedrag .node.grab { cursor: ew-resize; box-shadow: 0 0 0 4px rgba(21,26,45,.18); }
  .flowinfo .step { position: relative; }
  .flowinfo .step.open { outline: 2px solid #151a2d; outline-offset: 1px; }
  .flowinfo .step .sgo { display: inline-block; margin-left: 5px; width: 16px; height: 16px; border-radius: 50%; background: #151a2d; color: #fff;
                         font: 700 9px/16px var(--sans); text-align: center; vertical-align: 1px; cursor: pointer; }
  .flowinfo.graph { display: block; }
  svg#bandsvg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .bandfill { fill: rgba(109,74,255,.04); } .bandfill.alt { fill: rgba(255,255,255,0); }
  .bandline { fill: none; stroke: #dde1ee; stroke-width: 1; }
  .blabel { position: absolute; right: 12px; text-align: right; font-size: 10px; font-weight: 700; letter-spacing: .12em; color: #9aa0b8; text-transform: uppercase;
            transform-origin: 0 0; pointer-events: none; white-space: nowrap; }
  .flowbar { background: #fff; border-bottom: 1px solid var(--line); }
  .flowbar .flows { border-bottom: 0; }
  .flowinfo { display: grid; grid-template-columns: auto 1fr auto; gap: 10px 16px; align-items: start; padding: 2px 18px 12px; font-size: 13px; }
  .flowinfo .fnum { width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; font-weight: 800; background: var(--flow); color: #fff; }
  .flowinfo .what { line-height: 1.5; } .flowinfo .what b { font-family: var(--mono); font-size: 12px; font-weight: 600; }
  .flowinfo .steps { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; margin-top: 6px; font: 11.5px var(--mono); }
  .flowinfo .step { padding: 2px 7px; border-radius: 6px; background: #f1f2f8; cursor: pointer; }
  .flowinfo .step.chg { background: #ffe7b3; color: #7a4300; font-weight: 700; } .flowinfo .step.fx { background: var(--fx-bg); color: #b0163e; font-weight: 700; }
  .flowinfo .step.field { background: var(--field-bg); color: #006b6b; font-style: italic; }
  .flowinfo .arrow { color: #b3b8cc; }
  .flowinfo .side { min-width: 220px; max-width: 340px; border-left: 3px solid var(--fx); background: var(--warn-bg); border-radius: 0 10px 10px 0; padding: 6px 10px; font-size: 12px; }
  .flowinfo .side .k { font: 800 9.5px var(--sans); letter-spacing: .1em; text-transform: uppercase; color: #b0163e; display: block; margin-bottom: 2px; }
  .flowinfo .side .chk { margin-top: 6px; color: #3d4260; } .flowinfo .side .chk::before { content: "Check · "; font-weight: 700; }
  .flowinfo .less { color: var(--flow); cursor: pointer; font-weight: 600; font-size: 12px; margin-left: 6px; }
  .card > .hd { cursor: move; touch-action: none; } .card > .hd button { cursor: pointer; }
  .card.dragged { box-shadow: 0 22px 60px rgba(21,26,45,.3); }
  svg#edges { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
  .edge { fill: none; stroke: #c7cbdb; stroke-width: 1.6; transition: stroke .2s, opacity .2s; }
  .edge.flow { stroke: var(--flow); stroke-width: 3.2; filter: drop-shadow(0 0 5px var(--flow-glow)); }
  .edge.data { stroke-dasharray: 6 5; stroke: var(--field); } .edge.fx { stroke: var(--fx); stroke-width: 2.6; stroke-dasharray: 6 5; }
  .edge.dim { opacity: .25; }
  .node { position: absolute; transform-origin: center; padding: 7px 12px; border-radius: 12px; background: #fff; border: 1.5px solid #d4d8e6;
          font: 500 12.5px var(--mono); color: #4a5068; white-space: nowrap; box-shadow: 0 2px 6px rgba(21,26,45,.06); cursor: pointer;
          transition: opacity .2s, box-shadow .2s, border-color .2s; user-select: none; }
  .node:hover { box-shadow: 0 6px 18px rgba(21,26,45,.16); border-color: #9aa3c4; }
  .node.chg { background: linear-gradient(135deg, #ffd36b, #ffab1f); border: 2.5px solid var(--chg-deep); color: #2b1a00; font-weight: 700;
              padding: 9px 14px 8px; border-radius: 14px; animation: pulse 2.4s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(255,176,32,.55), 0 6px 16px rgba(194,106,0,.28); }
                     50% { box-shadow: 0 0 0 10px rgba(255,176,32,0), 0 6px 16px rgba(194,106,0,.28); } }
  .node.chg .kind { display: block; font: 800 9px/1 var(--sans); letter-spacing: .12em; text-transform: uppercase; color: #7a4300; margin-bottom: 4px; }
  .node.chg .stat { display: inline-flex; gap: 4px; margin-left: 8px; vertical-align: 1px; }
  .node.chg .stat b { font: 700 10px var(--mono); padding: 1px 5px; border-radius: 5px; background: #fff; }
  .node.chg .stat .p { color: var(--add-ink); } .node.chg .stat .m { color: var(--del-ink); }
  .node .warn-dot { position: absolute; right: -7px; top: -7px; width: 16px; height: 16px; border-radius: 50%; background: var(--warn); color: #fff;
                    font: 800 10px/16px var(--sans); text-align: center; box-shadow: 0 2px 6px rgba(255,77,109,.45); }
  .node.field { border-radius: 4px 14px 14px 4px; background: var(--field-bg); border-color: var(--field); font-style: italic; color: #005f5f; }
  .node.onflow { border-color: var(--flow); box-shadow: 0 0 0 4px var(--flow-glow); color: var(--ink); }
  .node.chg.onflow { box-shadow: 0 0 0 4px var(--flow-glow), 0 6px 16px rgba(194,106,0,.28); }
  .node.dim { opacity: .28; }
  .node.sel { outline: 3px solid #151a2d; outline-offset: 3px; }
  .node .fxbadge { position: absolute; left: 50%; top: calc(100% + 8px); transform: translateX(-50%); background: var(--fx); color: #fff;
                   font: 600 10.5px/1.3 var(--sans); padding: 4px 8px; border-radius: 8px; white-space: nowrap; box-shadow: 0 4px 12px rgba(255,77,109,.35); }
  .node .fxbadge::before { content: ""; position: absolute; top: -5px; left: 50%; margin-left: -5px; border: 5px solid transparent; border-top: 0; border-bottom-color: var(--fx); }
  /* cards */
  .card { position: absolute; width: 460px; background: var(--card); border-radius: 16px; box-shadow: 0 18px 48px rgba(21,26,45,.22);
          border: 1px solid var(--line); overflow: hidden; z-index: 50; cursor: default; transition: width .2s, box-shadow .2s; }
  .card.ctx .hd { background: linear-gradient(90deg, #eef1ff, #fff); }
  .hd { display: flex; align-items: center; gap: 8px; padding: 10px 12px; background: linear-gradient(90deg, #fff1cc, #fff); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .hd b { font-family: var(--mono); font-size: 13px; } .hd .file { color: var(--muted); font: 11px var(--mono); }
  .hd .sp { flex: 1; }
  .badge { font: 700 9.5px var(--sans); letter-spacing: .08em; text-transform: uppercase; padding: 2px 7px; border-radius: 6px; }
  .badge.ctx { background: #e7ebff; color: #3b4bd8; } .badge.chg { background: #ffe7b3; color: #7a4300; }
  .ibtn { border: 0; background: #f1f2f8; height: 28px; min-width: 28px; padding: 0 10px; border-radius: 8px; cursor: pointer; font: 600 12px var(--sans); color: var(--ink); }
  .ibtn:hover { background: #e5e3ff; }
  .seg { display: inline-flex; background: #f1f2f8; border-radius: 9px; padding: 2px; } .seg .ibtn { background: transparent; }
  .seg .ibtn.on { background: #fff; color: var(--flow); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .effects { padding: 8px 12px; background: #fff8fa; border-bottom: 1px solid var(--line); font-size: 12px; }
  .effects div { margin: 3px 0; } .effects .ico { color: var(--fx); font-weight: 700; margin-right: 4px; }
  .fetched { padding: 5px 12px; font: 11px var(--mono); color: var(--muted); background: #fafbfe; border-bottom: 1px solid var(--line); }
  .fetched b { color: #3b4bd8; font-weight: 600; }
  .card.min { width: auto !important; border-radius: 99px; box-shadow: 0 6px 16px rgba(21,26,45,.18); cursor: pointer; }
  .card.min > :not(.hd) { display: none; } .card.min .hd { border: 0; padding: 5px 6px 5px 12px; }
  .card.min .hd .file, .card.min .hd .badge, .card.min .hd .expand { display: none; }
  .card.min .hd .x, .card.min .hd .sp { display: none; } .card.min .hd .restore { display: inline-block; height: 22px; min-width: 22px; padding: 0 6px; }
  .card.min .hd { flex-wrap: nowrap; gap: 6px; background: #fff; }
  .card.min:not(.ctx) .hd { background: linear-gradient(90deg, #ffd36b, #ffab1f); }
  .hd .restore { display: none; }
  /* code */
  .code { font: 12px/1.65 var(--mono); overflow: auto; }
  .card .code { max-height: 300px; }
  .ln { display: grid; grid-template-columns: 40px 18px 1fr; cursor: pointer; min-width: max-content; }
  .ln:hover { background: #f5f3ff; }
  .no { color: #a3a8bf; text-align: right; padding-right: 6px; user-select: none; }
  .sg { color: #a3a8bf; text-align: center; user-select: none; }
  .a { background: var(--add); } .a .sg { color: var(--add-ink); font-weight: 700; }
  .d { background: var(--del); } .d .sg { color: var(--del-ink); font-weight: 700; }
  .ln.hot { background: #fff4f6; } .ln.hot .no { color: var(--warn); font-weight: 700; }
  .src { white-space: pre; padding-right: 12px; }
  .plus { visibility: hidden; margin-left: 6px; color: var(--flow); font: 700 11px var(--sans); }
  .ln:hover .plus, .sbs-row:hover .plus { visibility: visible; }
  .kw { color: #d6336c; font-weight: 600; } .ty { color: #6d4aff; } .num { color: #e8590c; } .str { color: #2b8a3e; }
  .cm { color: #8a90a8; font-style: italic; } .fn { color: #1c7ed6; } .mc { color: #0b7285; font-weight: 600; } .pp { color: #ae3ec9; }
  .ann { margin: 2px 12px 6px 58px; padding: 6px 10px 6px 12px; border-radius: 10px; font: 12px/1.4 var(--sans); border-left: 4px solid; white-space: normal; }
  .ann.warn { background: var(--warn-bg); border-color: var(--warn); color: #8a1230; }
  .ann.info { background: var(--info-bg); border-color: var(--info); color: #1d4ea0; }
  .ann.ok { background: var(--ok-bg); border-color: var(--ok); color: #13692f; }
  .ann .k { font-weight: 800; font-size: 10px; letter-spacing: .06em; text-transform: uppercase; margin-right: 6px; }
  .thread { margin: 4px 12px 8px 58px; padding: 8px 10px; border-radius: 12px; background: #f5f3ff; border: 1px solid #e0d9ff; font: 12.5px var(--sans); white-space: normal; }
  .thread .who { font-weight: 700; } .thread .when { color: var(--muted); font-size: 11px; margin-left: 6px; }
  .thread textarea { width: 100%; margin-top: 6px; border: 1px solid #d4ccff; border-radius: 10px; padding: 6px 8px; font: 12.5px var(--sans); resize: none; }
  .thread .row { display: flex; gap: 6px; justify-content: flex-end; margin-top: 6px; }
  .btn { border: 0; border-radius: 9px; padding: 6px 12px; font: 600 12px var(--sans); cursor: pointer; }
  .btn.pri { background: var(--flow); color: #fff; } .btn.sec { background: #eceef6; color: var(--ink); }
  .gap-row { background: #f1f2f8; color: var(--muted); font: 11px var(--sans); padding: 3px 12px; text-align: center; }
  .sbs-row { display: grid; grid-template-columns: 40px minmax(0, 1fr) 40px minmax(0, 1fr); cursor: pointer; }
  .sbs-row .src { white-space: pre-wrap; word-break: break-word; }
  .sbs-row > .src { border-right: 1px solid var(--line); }
  .sbs-row .l.d { background: var(--del); } .sbs-row .r.a { background: var(--add); }
  .sbs-row .l.d.no { color: var(--del-ink); font-weight: 700; } .sbs-row .r.a.no { color: var(--add-ink); font-weight: 700; }
  .sbs-row .empty { background: repeating-linear-gradient(135deg, #fafbfd, #fafbfd 6px, #f1f2f8 6px, #f1f2f8 12px); }
  /* full-file panel */
  #panel { display: none; flex-direction: column; background: #fff; border-left: 1px solid var(--line); box-shadow: -12px 0 32px rgba(21,26,45,.08); z-index: 60; min-width: 0; }
  #panel.open { display: flex; width: min(58vw, 980px); }
  #panel .code { flex: 1; }
  /* about drawer */
  #about { display: none; flex-direction: column; width: 420px; flex: none; background: #fff; border-left: 1px solid var(--line); z-index: 55; min-height: 0; }
  #about.open { display: flex; }
  #about.open { width: var(--about-w, 360px); }
  #panel.open { width: var(--panel-w, min(58vw, 980px)); }
  main.with-about #panel.open { width: var(--panel-w, min(calc(60vw - var(--about-w, 360px)), 820px)); }
  #about .top { position: relative; } #about .close { position: absolute; right: 12px; top: 12px; background: rgba(255,255,255,.16); color: #fff; }
  .tree .file.on { background: #efeaff; box-shadow: inset 3px 0 0 var(--flow); }
  #about .top { padding: 18px 20px 14px; background: linear-gradient(135deg, #151a2d, #2a2466); color: #fff; }
  #about .top h2 { margin: 6px 0 4px; font-size: 18px; } #about .top p { margin: 0; color: #c9caff; font-size: 13px; }
  #about .body { overflow: auto; padding: 16px 20px 24px; }
  #about h3 { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 18px 0 8px; }
  .intent { font-size: 14px; line-height: 1.55; }
  .why li { margin: 4px 0; } .why .sev { font: 800 9.5px var(--sans); padding: 1px 6px; border-radius: 5px; margin-right: 6px; }
  .sev.high { background: var(--fx); color: #fff; } .sev.medium { background: #ffcf66; color: #5a3a00; }
  .cl { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; }
  .cl .n { font: 700 12px var(--mono); color: var(--flow); } .cl .desc { margin-top: 2px; } .cl .m { color: var(--muted); font-size: 12px; }
  .tree { font: 13px var(--mono); border: 1px solid var(--line); border-radius: 12px; padding: 6px 0; }
  .tree .dir, .tree .file { display: flex; align-items: center; gap: 8px; padding: 5px 12px; cursor: pointer; }
  .tree .dir:hover, .tree .file:hover { background: #f5f3ff; }
  .tree .dir { font-weight: 700; color: #3b4bd8; } .tree .caret { width: 12px; color: var(--muted); }
  .tree .act { font: 700 9.5px var(--sans); text-transform: uppercase; padding: 1px 6px; border-radius: 5px; background: #fff1cc; color: #7a4300; }
  .tree .cnt { margin-left: auto; font-size: 11px; } .tree .cnt .p { color: var(--add-ink); } .tree .cnt .m { color: var(--del-ink); margin-left: 4px; }
  .tree .clb { font: 600 10px var(--sans); color: var(--flow); background: #efeaff; padding: 1px 6px; border-radius: 5px; }
  .hint { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); background: rgba(21,26,45,.86); color: #fff; font-size: 12px;
          padding: 7px 14px; border-radius: 99px; z-index: 90; pointer-events: none; transition: opacity .4s; }
  .legend { position: absolute; left: 12px; top: 56px; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; font-size: 11px;
            z-index: 40; box-shadow: 0 6px 18px rgba(21,26,45,.08); }
  .legend span { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin: 0 4px 0 8px; vertical-align: -1px; }
  @media (max-width: 1100px) { #panel.open { position: fixed; inset: 0; width: auto; border-left: 0; z-index: 70; }
                               #about.open { position: fixed; inset: 0; width: auto; border-left: 0; z-index: 65; } }
  @media (max-width: 760px) { .flowinfo { grid-template-columns: auto 1fr; } .flowinfo .side { grid-column: 1 / -1; max-width: none; } }
  @media (max-width: 640px) {
    .card:not(.min) { position: fixed; left: 8px !important; right: 8px; width: auto; top: auto !important; bottom: 8px; max-height: 72vh; }
    .card .code { max-height: 36vh; }
    .legend { display: none; }
    .chip .path { max-width: 190px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .hint { bottom: auto; top: 128px; }
    .about-btn { margin-left: 0; }
  }

  .node .go { position: absolute; right: -11px; bottom: -11px; width: 22px; height: 22px; border-radius: 50%; border: 0; cursor: pointer;
              background: #151a2d; color: #fff; font: 700 11px/22px var(--sans); box-shadow: 0 2px 6px rgba(0,0,0,.28); padding: 0; opacity: .0; transition: opacity .15s; }
  .node:hover .go, .node.chg .go, .node.has-card .go { opacity: 1; }
  .node.has-card { outline: 2px solid rgba(21,26,45,.55); outline-offset: 3px; }
  .node.front { outline: 3px solid #151a2d; }
  svg#edges .tether { stroke: #151a2d; stroke-width: 1.4; stroke-dasharray: 3 4; fill: none; opacity: .45; }
  svg#edges .tether.front { opacity: .9; stroke-width: 2; }
  .card { transform-origin: 0 0; }
  .card.front { box-shadow: 0 22px 60px rgba(21,26,45,.32), 0 0 0 2px #151a2d; }
  .toolbar { position: absolute; left: 12px; top: 12px; display: flex; gap: 8px; align-items: center; z-index: 45; flex-wrap: wrap; max-width: calc(100% - 24px); }
  .toolbar .seg { background: #fff; box-shadow: 0 4px 14px rgba(21,26,45,.1); }
  .toolbar .lbl { font: 700 10px var(--sans); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 0 4px 0 8px; }
  .toolbar .closeall { background: #fff; box-shadow: 0 4px 14px rgba(21,26,45,.1); }
  /* multi-file viewer */
  #panel .top { flex: none; display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); background: #fafbfe; }
  #panel .top b { font-size: 13px; } #panel .files { flex: 1; overflow: auto; }

function esc(s) { return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function lineDiff(a, b) {

  const out = []; let i = 0, j = 0;
  while (i < A.length || j < B.length) {
    if (i < A.length && j < B.length && A[i] === B[j]) { out.push({ t: "=", o: i + 1, n: j + 1, text: A[i] }); i++; j++; }
    else if (j < B.length && (i >= A.length || L[i][j + 1] >= L[i + 1][j])) { out.push({ t: "+", n: j + 1, text: B[j] }); j++; }

  box.querySelectorAll(".step").forEach((el) => el.onclick = (e) => {
    const id = el.dataset.id; if (!FUNCS[id]) return;
    if (e.target.closest(".sgo")) { dispatch({ t: "viewer.open", path: FUNCS[id].path, line: FUNCS[id].range[0] }); return; }
    const c = state.cards.get(id);
    dispatch(c && !c.collapsed ? { t: "card.close", id } : { t: "card.open", id });        // toggle from the summary bar
  });
}
function centreOn(path) {
  const xs = path.map((id) => N[id].x), ys = path.map(wy), W = stage.clientWidth, H = stage.clientHeight;
  const tx = W / 2 - (Math.min(...xs) + Math.max(...xs)) / 2, ty = H / 2 - (Math.min(...ys) + Math.max(...ys)) / 2;
  const sx = state.view.panX, sy = state.view.panY, t0 = performance.now();
  (function step(t) { const k = Math.min(1, (t - t0) / 380), e = 1 - Math.pow(1 - k, 3);
    state.view.panX = sx + (tx - sx) * e; state.view.panY = sy + (ty - sy) * e; render(); if (k < 1) requestAnimationFrame(step); })(t0);
}

/* ---------- "What's this change?" side panel (pushes the board; stays open while files are opened) ---------- */
function renderAbout() {
  const about = document.getElementById("about");
  document.querySelector("main").classList.toggle("with-about", state.about);
  if (!state.about) { about.classList.remove("open"); about.innerHTML = ""; requestAnimationFrame(render); return; }
  const changed = Object.entries(FILES).filter(([, f]) => f.action);
  const tree = {}; for (const [p] of changed) { const parts = p.split("/"), file = parts.pop(), dir = parts.join("/") || "."; (tree[dir] = tree[dir] || []).push([p, file]); }
  about.innerHTML = `<div class="top"><button class="ibtn close" title="Close">✕</button><span class="pill high">HIGH RISK</span><h2>What this change is trying to do</h2><p>CL 101 · CL 102 · ${changed.length} files · summarised from the CL descriptions, the diff and the analysis</p></div>
    <div class="body"><h3>Files in this change</h3><div class="tree">${Object.entries(tree).sort().map(([dir, fs]) => `
        <div class="dir" data-dir="${dir}"><span class="caret">▾</span>📁 ${dir}/</div>
        <div class="kids" data-kids="${dir}">${fs.map(([p, file]) => { const [a, m] = counts(FILES[p]);
          return `<div class="file${state.viewer.files.includes(p) ? " on" : ""}" data-path="${p}" style="padding-left:34px">📄 ${file}<span class="act">${FILES[p].action}</span><span class="clb">CL ${FILES[p].cls.join(", ")}</span><span class="cnt"><span class="p">+${a}</span><span class="m">−${m}</span></span></div>`; }).join("")}</div>`).join("")}
      </div>
      <h3>Intent</h3><div class="intent">${ABOUT.intent}</div>
      <h3>Why it's high risk</h3><ul class="why">${ABOUT.why.map(([s, t]) => `<li><span class="sev ${s}">${s.toUpperCase()}</span>${t}</li>`).join("")}</ul>
      <h3>Changelists</h3>${ABOUT.cls.map(([n, u, d]) => `<div class="cl"><span class="n">CL ${n}</span> <span class="m">· ${u} · ${changed.filter(([, f]) => f.cls.includes(n)).length} files</span><div class="desc">${d}</div></div>`).join("")}
    </div>`;
  about.querySelector(".close").onclick = () => dispatch({ t: "about.toggle", open: false });
  about.querySelectorAll(".dir").forEach((d) => d.onclick = () => { const k = about.querySelector(`[data-kids="${d.dataset.dir}"]`);
    const hide = k.style.display !== "none"; k.style.display = hide ? "none" : ""; d.querySelector(".caret").textContent = hide ? "▸" : "▾"; });
  about.querySelectorAll(".file").forEach((f) => f.onclick = () => { dispatch({ t: "viewer.open", path: f.dataset.path });
    about.querySelectorAll(".file").forEach((x) => x.classList.toggle("on", state.viewer.files.includes(x.dataset.path))); });
  about.prepend(addResizer(about, "--about-w", 280, 0.6));
  about.classList.add("open"); requestAnimationFrame(render);
}
document.getElementById("aboutBtn").onclick = () => dispatch({ t: "about.toggle" });
/* ---------- input ---------- */
function hideHint() { document.getElementById("hint").style.opacity = 0; }
let down = null;
stage.addEventListener("pointerdown", (e) => {
  const n = e.target.closest(".node"), onGo = e.target.closest(".go");
  down = { x: e.clientX, y: e.clientY, px: state.view.panX, py: state.view.panY, dragging: false, id: e.pointerId,
           node: n && !onGo ? n.dataset.id : null };
  if (!e.target.closest(".card")) e.preventDefault();                        // no text selection starting on the board
});
stage.addEventListener("pointermove", (e) => {
  if (!down) return;
  if (!down.dragging && Math.hypot(e.clientX - down.x, e.clientY - down.y) > 6) {
    down.dragging = true; stage.setPointerCapture(down.id); document.body.classList.add("dragging"); window.getSelection()?.removeAllRanges();
    if (down.node) { document.body.classList.add("nodedrag"); els[down.node].classList.add("grab"); } else stage.classList.add("drag");
    hideHint();
  }
  if (!down.dragging) return;
  if (down.node) {                                                            // move the function sideways within its layer
    const r = stage.getBoundingClientRect();
    dispatch({ t: "node.move", id: down.node, x: Math.round(unprojectX(e.clientX - r.left)) });
  } else { state.view.panX = down.px + (e.clientX - down.x); state.view.panY = down.py + (e.clientY - down.y); render(); }
});
stage.addEventListener("pointerup", (e) => {
  if (down && !down.dragging) {
    const go = e.target.closest(".go"), n = e.target.closest(".node");
    if (go && n) dispatch({ t: "viewer.open", path: FUNCS[n.dataset.id].path, line: FUNCS[n.dataset.id].range[0] });
    else if (n && FUNCS[n.dataset.id]) dispatch({ t: "card.open", id: n.dataset.id });
  }
  if (down?.node) els[down.node].classList.remove("grab");
  down = null; stage.classList.remove("drag"); document.body.classList.remove("dragging", "nodedrag");
});
stage.addEventListener("wheel", (e) => { state.view.panX -= e.deltaX + (e.shiftKey ? e.deltaY : 0); if (!e.shiftKey) state.view.panY -= e.deltaY; render(); e.preventDefault(); }, { passive: false });
document.querySelectorAll("#lens .ibtn").forEach((b) => b.onclick = () => dispatch({ t: "lens", m: +b.dataset.m }));
document.getElementById("closeAll").onclick = () => dispatch({ t: "card.closeAll" });
document.querySelectorAll("#mode .ibtn").forEach((b) => b.onclick = () => dispatch({ t: "mode", m: b.dataset.m }));
document.getElementById("resetLayout").onclick = () => dispatch({ t: "layout.reset" });

/* ---------- resizable side panels (drag the left edge) ---------- */
function addResizer(el, cssVar, min, maxFrac) {
  const h = document.createElement("div"); h.className = "resizer"; h.title = "Drag to resize";
  h.addEventListener("pointerdown", (e) => {
    e.preventDefault(); h.setPointerCapture(e.pointerId); document.body.classList.add("resizing");
    const startX = e.clientX, startW = el.getBoundingClientRect().width;
    const move = (ev) => { const w = Math.max(min, Math.min(window.innerWidth * maxFrac, startW + (startX - ev.clientX)));
      document.documentElement.style.setProperty(cssVar, w + "px"); render(); };
    const up = () => { h.removeEventListener("pointermove", move); h.removeEventListener("pointerup", up); document.body.classList.remove("resizing"); };
    h.addEventListener("pointermove", move); h.addEventListener("pointerup", up);
  });
  return h;
}
window.addEventListener("resize", render);
renderFlows(); renderFlowInfo();
state.view.panX = stage.clientWidth / 2 - N.uart_send.x; state.view.panY = stage.clientHeight / 2 - (LAYERS.length * BAND) / 2;
render();
if (window.innerWidth > 640) dispatch({ t: "card.open", id: "uart_send" });
setTimeout(hideHint, 7000);
</script>
